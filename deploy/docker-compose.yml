# GoClaw + Postgres (pgvector) + headless Chrome for Skipli content skills.
# Merged from GoClaw's docker-compose.yml + .postgres.yml + .browser.yml.
#
# Image: GoClaw upstream does not yet include the browser fix in
# goclaw-patches/ (Facebook tabs get closed). Until it is merged, build a
# patched image and point GOCLAW_IMAGE at it - see deploy/README.md.
#
#   cp .env.example .env   # fill in tokens
#   docker compose up -d
#   docker compose stop    # keeps data. Never `down -v` (wipes DB + cookies)

services:
  goclaw:
    image: ${GOCLAW_IMAGE:-ghcr.io/nextlevelbuilder/goclaw:latest}
    ports:
      - "${GOCLAW_PORT:-18790}:18790"
    environment:
      - GOCLAW_HOST=0.0.0.0
      - GOCLAW_PORT=18790
      - GOCLAW_CONFIG=/app/data/config.json
      - GOCLAW_GATEWAY_TOKEN=${GOCLAW_GATEWAY_TOKEN:?set GOCLAW_GATEWAY_TOKEN in deploy/.env}
      # Encrypts provider keys and browser cookies; changing it makes stored secrets unreadable.
      - GOCLAW_ENCRYPTION_KEY=${GOCLAW_ENCRYPTION_KEY:?set GOCLAW_ENCRYPTION_KEY in deploy/.env}
      - GOCLAW_SKILLS_DIR=/app/data/skills
      - GOCLAW_POSTGRES_DSN=postgres://${POSTGRES_USER:-goclaw}:${POSTGRES_PASSWORD:-goclaw}@postgres:5432/${POSTGRES_DB:-goclaw}?sslmode=disable
      - GOCLAW_BROWSER_REMOTE_URL=ws://chrome:9222
    volumes:
      - goclaw-data:/app/data
      - goclaw-skills:/app/skills
      - goclaw-workspace:/app/workspace
      - goclaw-workspace:/app/.goclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      chrome:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
          pids: 400
    restart: unless-stopped

  # Skipli Content (web/): Node API + React UI, data in Firestore. Run ONE replica -
  # the job queue lives in-process. Only reachable from this machine unless
  # WEB_BIND=0.0.0.0; set APP_PASSWORD before exposing it (every run spends model quota).
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    # Everything in deploy/.env reaches the server (storage bucket, GPU worker, Facebook page...);
    # the list below only adds defaults and the in-network addresses.
    env_file:
      - .env
    environment:
      - GOCLAW_URL=http://goclaw:18790
      - GOCLAW_GATEWAY_TOKEN=${GOCLAW_GATEWAY_TOKEN}
      - GOCLAW_USER_ID=${GOCLAW_USER_ID:-system}
      - AGENT_SCOUT=${AGENT_SCOUT:-content-scout}
      - AGENT_WRITER=${AGENT_WRITER:-content-writer}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - ACCOUNTS=${ACCOUNTS:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - USER_DAILY_JOB_LIMIT=${USER_DAILY_JOB_LIMIT:-30}
      # Self sign-up with trial credits and Stripe top-ups (see deploy/README.md, section 3c).
      - SIGNUP=${SIGNUP:-}
      - TRIAL_CREDITS=${TRIAL_CREDITS:-20}
      - SIGNUP_PER_IP=${SIGNUP_PER_IP:-0}
      # Only proxies on this machine or the Docker network (Caddy) are believed about the visitor's IP: a
      # visitor reaching the web port directly cannot fake X-Forwarded-For. Cloudflare's proxy in front: 2.
      - TRUST_PROXY=${TRUST_PROXY:-loopback,uniquelocal}
      # Sign-up and password codes by email (Gmail SMTP with an App Password); MAIL_LOG=1 prints them instead.
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_LOG=${MAIL_LOG:-}
      # Errors to a Slack / Discord webhook; daily database backup to the bucket; shutdown wait for jobs.
      - ERROR_WEBHOOK_URL=${ERROR_WEBHOOK_URL:-}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      - SHUTDOWN_WAIT_SEC=${SHUTDOWN_WAIT_SEC:-25}
      - HEAVY_PER_USER=${HEAVY_PER_USER:-2}
      - COST_TOKEN_USD_PER_M=${COST_TOKEN_USD_PER_M:-0.5}
      - CREDIT_PACKS=${CREDIT_PACKS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - JOB_CONCURRENCY=${JOB_CONCURRENCY:-2}
      # Firestore (firebase-admin). Service account JSON as one line, see deploy/README.md.
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in deploy/.env}
      - FIREBASE_SERVICE_ACCOUNT=${FIREBASE_SERVICE_ACCOUNT:-}
      - FIRESTORE_DATABASE_ID=${FIRESTORE_DATABASE_ID:-}
      - FIRESTORE_PREFIX=${FIRESTORE_PREFIX:-content_}
      # Facebook "100 latest reels" scan (optional)
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - APIFY_FB_REELS_ACTOR=${APIFY_FB_REELS_ACTOR:-apify~facebook-reels-scraper}
      - REEL_LIST_CACHE_HOURS=${REEL_LIST_CACHE_HOURS:-6}
      # Free AI path (no GoClaw agent run): Groq for writing and reports, Gemini to watch videos.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Google Maps reviews (lowest and highest rated) through Apify, paid per review.
      - APIFY_REVIEWS_TOKEN=${APIFY_REVIEWS_TOKEN:-}
      # Google Maps reviews are read in the Chrome sidecar.
      - CHROME_CDP_URL=http://chrome:9222
      # Usage limits (0 = off) and the competitor watch interval.
      - DAILY_JOB_LIMIT=${DAILY_JOB_LIMIT:-500}
      - JOB_LIMIT_PER_IP_HOUR=${JOB_LIMIT_PER_IP_HOUR:-0}
      - CHAT_LIMIT_PER_IP_MINUTE=${CHAT_LIMIT_PER_IP_MINUTE:-8}
      - WATCH_INTERVAL_HOURS=${WATCH_INTERVAL_HOURS:-168}
    # Rendered videos, uploads, the AI-watched clips and the GPU worker settings live here.
    volumes:
      - web-data:/app/.data
    depends_on:
      - goclaw
      - chrome
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    # Bound to localhost only; the gateway reaches it as postgres:5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goclaw}
      POSTGRES_DB: ${POSTGRES_DB:-goclaw}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goclaw} -d ${POSTGRES_DB:-goclaw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chrome:
    image: chromedp/headless-shell:latest
    # Entrypoint already sets the remote-debugging address/port; re-adding them breaks Chrome.
    command:
      - --no-sandbox
      - --headless=new
      - --remote-allow-origins=*
      - --disable-gpu
      - --disable-dev-shm-usage
    # CDP has no auth - never expose it publicly.
    ports:
      - "127.0.0.1:${CHROME_CDP_PORT:-9222}:9222"
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
    restart: unless-stopped

  # HTTPS in front of the web (Let's Encrypt, renewed by Caddy): docker compose --profile https up -d
  # Needs DOMAIN in deploy/.env and its DNS A record pointing at this server, ports 80 and 443 open.
  caddy:
    image: caddy:2.10
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  web-data:
  goclaw-data:
  goclaw-skills:
  goclaw-workspace:
  postgres-data:
